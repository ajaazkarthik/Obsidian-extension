name: One-time generated-file cleanup
on:
  push:
    branches:
      - feat/obsidian-brain-v2-15-mcp-index-archives
    paths:
      - .github/workflows/cleanup-generated-once.yml
permissions:
  contents: write
jobs:
  clean:
    if: github.ref_name == 'feat/obsidian-brain-v2-15-mcp-index-archives'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Untrack generated dependencies and packages, then remove this one-off workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm -r --cached --ignore-unmatch node_modules out
          git ls-files -z '*.vsix' | xargs -0 -r git rm --cached --
          git rm --cached -- .github/workflows/cleanup-generated-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --cached --quiet; then
            git commit -m 'chore: stop tracking generated dependencies, compiled output and VSIX files'
            git push origin HEAD:feat/obsidian-brain-v2-15-mcp-index-archives
          fi
